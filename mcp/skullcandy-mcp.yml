server:
  name: skullcandy-ucp-shopping
  description: Hosted Universal Commerce Protocol (UCP) shopping MCP server for the Skullcandy Shopify
    storefront. Agents call the MCP endpoint to search the catalog, build a cart, and drive a buyer-approved
    checkout. Payment is completed through registered handlers (Shop Pay, Shopify Card, Google Pay); checkout
    requires contemporaneous human approval.
  transport: http
  protocol: mcp
  url: https://www.skullcandy.com/api/ucp/mcp
  method: POST
  content_type: application/json
  discovery: https://www.skullcandy.com/.well-known/ucp
  ucp_version: '2026-04-08'
