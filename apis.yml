aid: skullcandy
name: Skullcandy
description: >-
  Skullcandy is a US consumer-audio brand that designs and sells headphones,
  wireless earbuds, gaming headsets, and Bluetooth speakers. Its e-commerce
  storefront at skullcandy.com runs on Shopify, and rather than a traditional
  developer program the brand exposes a modern agentic-commerce surface: an
  agent-facing llms.txt / agents.md, a Universal Commerce Protocol (UCP)
  merchant profile with a hosted Model Context Protocol (MCP) endpoint for
  catalog search, cart, checkout and fulfillment, a Shopify Customer Account
  API secured with OpenID Connect / OAuth 2.0 (including a customer-account
  MCP scope), and read-only storefront JSON endpoints for products and
  collections. This profile captures that agent- and API-facing surface as
  discovered on the live site.
