apis:
- name: Skullcandy Agentic Commerce (UCP)
  description: >-
    Universal Commerce Protocol (UCP) merchant surface for the Skullcandy
    Shopify storefront. Agents discover capabilities at /.well-known/ucp and
    transact against a hosted MCP endpoint (catalog search, cart, checkout,
    fulfillment, discounts, order) with buyer-approved payment via Shop Pay,
    Shopify Card, and Google Pay handlers.
  humanURL: https://ucp.dev/2026-04-08/specification/overview/
  baseURL: https://www.skullcandy.com/api/ucp/mcp
  properties:
  - type: MCPServer
    url: mcp/skullcandy-mcp.yml
  - type: WellKnown
    url: well-known/skullcandy-ucp.json
- name: Skullcandy Customer Account API (Shopify)
  description: >-
    Shopify Customer Account API for the Skullcandy store, secured with
    OpenID Connect / OAuth 2.0 (authorization code + PKCE). Scopes include
    customer-account-api:full and customer-account-mcp-api:full. Authorization
    and token endpoints are served from account.skullcandy.com.
  humanURL: https://shopify.dev/docs/api/customer
  baseURL: https://account.skullcandy.com/authentication
  properties:
  - type: Authentication
    url: authentication/skullcandy-authentication.yml
  - type: OAuthScopes
    url: scopes/skullcandy-scopes.yml
  - type: WellKnown
    url: well-known/skullcandy-openid-configuration.json
- name: Skullcandy Storefront Data (read-only)
  description: >-
    Unauthenticated read-only storefront endpoints for browsing catalog data:
    product JSON (/products/{handle}.json), collection JSON
    (/collections/{handle}/products.json), search, and sitemap.xml.
  humanURL: https://www.skullcandy.com/agents.md
  baseURL: https://www.skullcandy.com
